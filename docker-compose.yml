# Local development database. Production images/compose arrive in Phase 5.
name: carwash

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: carwash
      POSTGRES_PASSWORD: carwash_dev_only
      POSTGRES_DB: carwash
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carwash -d carwash']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
