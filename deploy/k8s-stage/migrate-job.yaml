apiVersion: batch/v1
kind: Job
metadata:
  generateName: kleenbay-stage-migrate-
  namespace: kleenbay-stage
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: 208519604276.dkr.ecr.us-east-1.amazonaws.com/kleenbay/stage-api@sha256:bdd2ef7c48cd4ed8ddf0b597fd3d139d205b60720e87f2f4b8a0d33ab6cb9d48
          command: [sh, -c, "cd apps/api && ./node_modules/.bin/prisma migrate deploy"]
          envFrom:
            - configMapRef:
                name: kleenbay-stage-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kleenbay-stage-migrator-db
                  key: DATABASE_URL
