apiVersion: batch/v1
kind: Job
metadata:
  generateName: kleenbay-stage-migrate-
  namespace: kleenbay-stage
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: 208519604276.dkr.ecr.us-east-1.amazonaws.com/kleenbay/stage-api@sha256:20516d5591d39e9c622c3886761e96e75a524c0b343ba0616c724e861d2fb32d
          command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: kleenbay-stage-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kleenbay-stage-migrator-db
                  key: DATABASE_URL
