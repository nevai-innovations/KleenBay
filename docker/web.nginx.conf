server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://verify.msg91.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://verify.msg91.com https://control.msg91.com https://www.google.com; img-src 'self' data: https://verify.msg91.com https://www.google.com https://www.gstatic.com; frame-src https://verify.msg91.com https://www.google.com https://recaptcha.google.com" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /track/ {
        access_log off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://verify.msg91.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://verify.msg91.com https://control.msg91.com https://www.google.com; img-src 'self' data: https://verify.msg91.com https://www.google.com https://www.gstatic.com; frame-src https://verify.msg91.com https://www.google.com https://recaptcha.google.com" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
}
