<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Car Wash Tracker — Prototype</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#0b1220;--muted:#4a5568;--line:#d6dce4;--brand:#0a58ca;--danger:#b42318;--ok:#15803d;--radius:14px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
[hidden]{display:none!important}

/* Header + nav */
.top{position:sticky;top:0;z-index:30;height:60px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{font-weight:800;font-size:17px}
.biz{color:#cbd5e1;font-size:13px}
.top nav{margin-left:auto;display:none;gap:4px;align-items:center}
.top nav a{color:#e2e8f0;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:600}
.top nav a.active{background:#1e293b;color:#fff}
.top nav a.new{background:var(--brand);color:#fff;margin-left:8px}
.proto{background:#fef3c7;color:#78350f;font-size:13px;text-align:center;padding:6px 16px}
main{padding:12px 12px 130px;max-width:1440px;margin:0 auto}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:700}
.bottom a.active{color:var(--brand)}
.bottom a.fab{flex-direction:row;gap:6px;background:var(--brand);color:#fff;border-radius:999px;padding:0 24px;height:58px;font-size:17px;margin-top:-26px;box-shadow:0 6px 18px rgb(10 88 202 / .4)}
.bottom svg{width:24px;height:24px}
@media(min-width:1024px){.top nav{display:flex}.bottom{display:none}main{padding:20px 24px 40px}}

/* Board */
h1{font-size:24px;margin:0}
.sub{color:var(--muted);font-size:15px;font-weight:600}
.board-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 10px}
.search{flex:1 1 240px;max-width:380px;height:50px;border:2px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font-size:17px}
.search:focus,.field input:focus,.field textarea:focus{outline:3px solid #93c5fd;border-color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:sticky;top:60px;z-index:20;background:var(--bg)}
.chip{flex:none;display:flex;gap:8px;align-items:center;height:46px;padding:0 14px;border:2px solid var(--line);background:#fff;border-radius:999px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.n{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#e2e8f0;color:var(--ink);font-size:13px;font-weight:800;display:inline-grid;place-items:center}
.dot{width:11px;height:11px;border-radius:50%;background:var(--stage);flex:none}
.lanes{display:flex;flex-direction:column;gap:18px}
.lane-title{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.lane-list{display:grid;gap:10px}
.lanes.all .lane.is-empty,.lane.filtered-out{display:none}
@media(min-width:640px) and (max-width:1023px){.lane-list{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){
  .chips{display:none}
  .lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
  .lane,.lanes.all .lane.is-empty,.lane.filtered-out{display:block!important;background:#e2e7ee;border-radius:16px;padding:10px;min-height:65vh}
  .card .reg{font-size:19px}
}
.empty{color:var(--muted);font-size:14px;padding:14px;border:2px dashed #c5cdd8;border-radius:12px;text-align:center}

/* Card */
.card{background:#fff;border:1px solid var(--line);border-left:8px solid var(--stage);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgb(0 0 0 / .06)}
.card-body{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px 10px;cursor:pointer}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.reg{font-size:22px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.jobno{color:var(--muted);font-size:13px;font-weight:700}
.veh{font-weight:700}
.meta{color:var(--muted);font-size:15px}
.times{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:6px;font-size:14px;color:var(--muted)}
.times b{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;font-weight:700;border-radius:8px;padding:3px 8px;background:#eef2f6}
.tag.late{background:#fee4e2;color:var(--danger)}
.next{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;background:var(--stage-next);color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.next:active{filter:brightness(.88)}
.card.flash{animation:flash 2s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 5px #facc15}100%{box-shadow:0 0 0 0 transparent}}

/* Toast + sheet */
.toast{position:fixed;left:12px;right:12px;bottom:92px;z-index:40;max-width:540px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgb(0 0 0 / .3);font-weight:700}
.toast small{display:block;color:#86efac;font-weight:600;margin-top:2px}
.toast button{margin-left:auto;flex:none;min-height:46px;padding:0 18px;border:0;border-radius:10px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer}
@media(min-width:1024px){.toast{bottom:24px}}
.overlay{position:fixed;inset:0;z-index:50;background:rgb(15 23 42 / .55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet p{margin:4px 0}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:20px}}
.btn-row{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:18px}
.btn{min-height:58px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:17px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.big{width:100%;min-height:62px;font-size:19px}

/* Form */
.form{max-width:660px;margin:0 auto;display:grid;gap:16px}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-decoration:none}
.field{display:grid;gap:6px;font-weight:700}
.field input,.field textarea{width:100%;height:56px;border:2px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font-size:18px;font-weight:600}
.field textarea{height:100px;padding:12px 14px;resize:vertical}
.field.invalid input{border-color:var(--danger)}
.reg-input{text-transform:uppercase;font-size:24px!important;letter-spacing:1px}
.opt{color:var(--muted);font-weight:500}
.err{color:var(--danger);font-size:14px;font-weight:700}
.err:empty{display:none}
.phone{display:flex}
.phone>span{display:grid;place-items:center;padding:0 14px;border:2px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:#eef2f6;font-size:18px}
.phone input{border-radius:0 12px 12px 0;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;padding:0;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile,.pill{position:relative;display:block}
.tile input,.pill input{position:absolute;opacity:0;width:1px;height:1px}
.tile span{display:grid;gap:2px;min-height:68px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:800;cursor:pointer}
.tile small{color:var(--muted);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill span{display:flex;align-items:center;min-height:48px;padding:0 16px;border:2px solid var(--line);border-radius:999px;background:#fff;font-weight:700;cursor:pointer}
.tile input:checked+span,.pill input:checked+span{border-color:var(--brand);background:#e7f0ff;box-shadow:inset 0 0 0 1px var(--brand)}
.tile input:focus-visible+span,.pill input:focus-visible+span{outline:3px solid #93c5fd}
.muted{color:var(--muted)}
.notice{border-radius:12px;padding:12px 14px;background:#e6f4ea;color:#14532d;font-weight:700}
.notice.warn{background:#fff1e0;color:#7a2e0e}
details summary{min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--brand);cursor:pointer}
.check{display:flex;gap:12px;align-items:center;min-height:48px;font-weight:700}
.check input{width:26px;height:26px}

/* Detail */
.hero{display:grid;gap:14px;background:#fff;border:1px solid var(--line);border-top:8px solid var(--stage);border-radius:16px;padding:14px 16px}
.hero .reg{font-size:30px}
.hero-sub{font-weight:700}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:4px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;cursor:pointer}
.qa span{font-size:20px;line-height:1}
@media(min-width:900px){.hero{grid-template-columns:1fr minmax(320px,380px);align-items:center}.p-progress{order:1}.p-details{order:2}.p-photos{order:3}.p-updates{order:4}}
.pill-status{background:var(--stage);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;white-space:nowrap}
.call{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--line);text-decoration:none;font-weight:800;color:var(--ink)}
.dgrid{display:grid;gap:12px;margin-top:12px}
@media(min-width:900px){.dgrid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel h2{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;min-height:42px}
.tl .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:#fff;color:#fff;font-size:14px;font-weight:900}
.tl li.done .mk{background:var(--ok);border-color:var(--ok)}
.tl li.current .mk{background:var(--stage);border-color:var(--stage);box-shadow:0 0 0 5px color-mix(in srgb,var(--stage) 25%,transparent)}
.tl li.current .lbl{font-weight:800}
.tl li.todo{color:var(--muted)}
.tl small{color:var(--muted);font-weight:500}
.tl time{font-weight:700;font-variant-numeric:tabular-nums}
.tl li.revert{min-height:32px;font-size:14px;color:#92400e}
.tl li.revert .mk{border-color:#f59e0b;color:#92400e;width:22px;height:22px;margin-left:3px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.notif{padding:10px 0;border-top:1px solid var(--line)}
.notif:first-of-type{border-top:0;padding-top:0}
.notif .row{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:#e2e8f0;white-space:nowrap}
.badge.sent{background:#dcfce7;color:#14532d}
.badge.queued{background:#fef3c7;color:#78350f}
.notif p{margin:6px 0 0;color:var(--muted);font-size:14px}
.action-bar{position:sticky;bottom:84px;margin-top:14px;z-index:10}
.action-bar .next{border-radius:14px;box-shadow:0 8px 22px rgb(0 0 0 / .2);min-height:62px;font-size:19px}
@media(min-width:1024px){.action-bar{bottom:16px;max-width:420px;margin-left:auto}}
.hist{display:grid;gap:8px}
.hrow{display:grid;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);border-left:8px solid #1f2937;border-radius:14px;padding:12px 14px;cursor:pointer}
@media(min-width:900px){.hist{grid-template-columns:1fr 1fr}}

/* Drag and drop */
.card-body{cursor:grab;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.grip{color:#94a3b8;margin-left:6px;font-size:15px}
.card.drag-src{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:60;margin:0;pointer-events:none;opacity:.95;box-shadow:0 18px 40px rgb(0 0 0 / .3)}
.ghost-chip{background:#fff;border:2px solid var(--ink);border-left:8px solid var(--stage);border-radius:12px;padding:8px 14px;font-size:18px;font-weight:800;white-space:nowrap;opacity:1}
body.dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:55;background:#fff;border-top:3px solid var(--ink);padding:10px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgb(0 0 0 / .2)}
.tray-title{text-align:center;font-weight:800;margin-bottom:8px}
.tray-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:980px;margin:0 auto}
@media(min-width:1024px){.tray-grid{grid-template-columns:repeat(6,1fr)}}
.drop{display:grid;justify-items:center;align-content:center;gap:2px;min-height:74px;padding:8px 4px;border:3px dashed var(--line);border-radius:14px;background:#f8fafc;text-align:center;transition:transform .08s}
.drop b{font-size:15px}
.drop small{font-size:12px;font-weight:700;color:var(--muted)}
.drop.drop-ok{border-color:var(--stage);background:color-mix(in srgb,var(--stage) 10%,#fff)}
.drop.drop-ok small{color:var(--stage)}
.drop.drop-no{opacity:.45}
.drop.drop-current{border-style:solid;opacity:.65}
.drop.over.drop-ok{background:var(--stage);border-style:solid;color:#fff;transform:scale(1.05)}
.drop.over.drop-ok small{color:#fff}
.drop.over.drop-no{opacity:1;border-color:var(--danger);background:#fee4e2}
.lane.drop-ok{outline:3px dashed var(--stage);outline-offset:-3px}
.lane.over.drop-ok{background:color-mix(in srgb,var(--stage) 14%,#e2e7ee)}
.lane.drop-no{opacity:.55}
.lane.over.drop-no{outline:3px solid var(--danger);outline-offset:-3px}

/* Photos */
.photo-cols{display:grid;gap:16px}
@media(min-width:640px){.photo-cols{grid-template-columns:1fr 1fr}}
.photo-cols h3,.sheet-photos h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:16px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{position:relative;display:block;width:100%;aspect-ratio:1;padding:0;overflow:hidden;border:2px solid var(--line);border-radius:12px;background:#e2e8f0;cursor:pointer}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb-time{position:absolute;left:4px;bottom:4px;background:rgb(0 0 0 / .65);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px}
.thumb-x{position:absolute;top:4px;right:4px;width:34px;height:34px;border:0;border-radius:50%;background:rgb(0 0 0 / .72);color:#fff;font-size:20px;font-weight:800;line-height:1;cursor:pointer}
.add-photo{display:grid;place-items:center;align-content:center;gap:2px;aspect-ratio:1;padding:4px;border:2px dashed #94a3b8;border-radius:12px;background:#f8fafc;color:var(--brand);font-size:14px;font-weight:800;text-align:center;cursor:pointer}
.add-photo span{font-size:26px;line-height:1}
.add-photo[aria-busy="true"]{opacity:.55;cursor:progress}
.sheet{max-height:92dvh;overflow:auto}
.sheet-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.sheet-photos h3{font-size:14px;color:var(--muted)}
.sheet-photos .photo-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.lb{position:fixed;inset:0;z-index:70;display:grid;grid-template-rows:auto 1fr auto;background:#05080f;color:#fff}
.lb-top,.lb-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.lb-top small{display:block;color:#cbd5e1}
.lb-bottom{justify-content:center;min-height:76px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.lb-stage{position:relative;display:grid;place-items:center;min-height:0;touch-action:pan-y}
.lb-stage img{max-width:100%;max-height:calc(100dvh - 170px);object-fit:contain;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.lb-btn{width:48px;height:48px;border:0;border-radius:50%;background:#1e293b;color:#fff;font-size:20px;cursor:pointer}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border:0;border-radius:50%;background:rgb(30 41 59 / .85);color:#fff;font-size:30px;line-height:1;cursor:pointer}
.lb-nav.prev{left:10px}
.lb-nav.next{right:10px}
.lb-nav:disabled{opacity:.25;cursor:default}
.btn.danger{padding:0 22px;border-color:#fca5a5;background:#fff;color:var(--danger)}
.lock{color:#cbd5e1;font-weight:600;text-align:center}

/* ===== Mobile-first design pass ===== */
button,a,label{-webkit-tap-highlight-color:transparent}
.top-id{min-width:0}
.brand-biz,.proto-tag,.avatar{display:none}
.proto-tag{margin-left:auto;border-radius:999px;padding:3px 8px;background:#fde68a;color:#78350f;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:#1e293b;color:#fff;font-weight:800;place-items:center}

.pagebar{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.pb-back{flex:none;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:22px;font-weight:800;text-decoration:none}
.pb-title{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:24px}

.board-sticky{margin-bottom:6px}
.board-sticky .chips{position:static}
.board-head{flex-wrap:nowrap}
.bh-title{flex:none;display:flex;align-items:center;gap:8px}
.count-pill{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 9px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800}
.bh-hint{display:none;color:var(--muted);font-size:14px;font-weight:600}
.search-wrap{position:relative;display:block;flex:1 1 auto;max-width:380px}
.search-wrap svg{position:absolute;left:12px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-wrap .search{width:100%;max-width:none;padding-left:40px}
.chip[aria-pressed="true"]{background:var(--stage);border-color:var(--stage);color:#fff}
.chip[aria-pressed="true"] .n{background:rgb(255 255 255 / .25);color:#fff}
.chip[aria-pressed="true"] .dot{background:#fff}
.chip.late:not([aria-pressed="true"]){border-color:#fca5a5;color:var(--danger)}
.tip{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:6px 6px 6px 14px;border-radius:12px;background:#e0ecff;color:#0b3a82;font-size:14px;font-weight:700}
.tip button{flex:none;margin-left:auto;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:inherit;font-size:16px;cursor:pointer}
@media(min-width:1024px){.bh-hint{display:inline}.board-head{justify-content:flex-start;gap:16px}.search-wrap{margin-left:auto}}

.card-body{display:grid;gap:4px;padding:12px 14px}
.card.is-late{box-shadow:0 0 0 2px #fca5a5}
.c-row1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px}
.c-row2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.c-row3{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--muted);font-size:14px}
.c-row3 b{color:var(--ink)}
.since{flex:none;border-radius:999px;padding:3px 9px;background:#eef2f6;color:var(--ink);font-size:13px;font-weight:800;white-space:nowrap}

/* ===== Premium theme: depth, gradients, motion ===== */
:root{
  --brand:#4f46e5;--brand-2:#7c3aed;--gold:#f59e0b;
  --ink:#0b1020;--bg:#eceffa;--line:#e3e7f2;--muted:#515a76;
  --sh-1:0 1px 2px rgb(16 24 64 / .06), 0 2px 6px rgb(16 24 64 / .06);
  --sh-2:0 2px 6px rgb(16 24 64 / .07), 0 14px 28px -12px rgb(16 24 64 / .22);
  --sh-3:0 6px 16px rgb(16 24 64 / .12), 0 28px 52px -16px rgb(16 24 64 / .34);
  --glass:rgb(255 255 255 / .82);
}
body{background:radial-gradient(900px 620px at 10% -12%, #dce5ff 0%, transparent 60%),radial-gradient(760px 520px at 108% -4%, #efe1ff 0%, transparent 55%),var(--bg);background-attachment:fixed}
::selection{background:#ddd6fe;color:var(--ink)}
:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}

.top{background:linear-gradient(118deg,#0a0f22 0%,#1b2050 58%,#301c52 100%);border-bottom:1px solid rgb(255 255 255 / .08);box-shadow:0 10px 30px -18px rgb(10 15 34 / .95)}
.brand-app,.brand-biz{background:linear-gradient(92deg,#fff 20%,#c7d2fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.avatar{background:linear-gradient(140deg,var(--brand),var(--brand-2));box-shadow:0 6px 16px -6px rgb(124 58 237 / .8)}
.proto-tag{background:linear-gradient(140deg,#fde68a,#f59e0b);color:#5a3803}
.top nav a.new{background:linear-gradient(140deg,var(--brand),var(--brand-2));box-shadow:0 8px 20px -10px rgb(79 70 229 / .95)}
.bottom{background:rgb(255 255 255 / .86);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.new-circle{background:linear-gradient(140deg,var(--brand),var(--brand-2));box-shadow:0 10px 22px -8px rgb(79 70 229 / .85)}

.panel,.form-card,.kpi,.hero,.hrow,.att-row,.tray,.sheet{background:var(--glass);backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);border:1px solid rgb(255 255 255 / .75);box-shadow:var(--sh-2)}
.panel,.form-card,.hero{border-radius:18px}
.sheet{background:rgb(255 255 255 / .95)}

.card{position:relative;border:1px solid rgb(255 255 255 / .8);border-left:0;border-radius:18px;background:linear-gradient(180deg,#fff 0%,#f7f9ff 100%);box-shadow:var(--sh-2);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;will-change:transform}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:18px 0 0 18px;background:linear-gradient(180deg,var(--stage),color-mix(in srgb,var(--stage) 45%,#fff))}
.card-body{padding-left:20px}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}
.card:active{transform:translateY(-1px)}
.card.is-late{box-shadow:0 0 0 2px #fda4a4, var(--sh-2)}
.reg{letter-spacing:.4px}
.since{box-shadow:inset 0 0 0 1px rgb(16 24 64 / .05)}

.next{position:relative;overflow:hidden;background-color:var(--stage-next);background-image:linear-gradient(140deg,rgb(255 255 255 / .22),rgb(255 255 255 / 0) 45%);box-shadow:inset 0 1px 0 rgb(255 255 255 / .3);transition:filter .18s,transform .12s}
.next::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgb(255 255 255 / .35),transparent);transform:skewX(-18deg)}
.next:hover::after{animation:sheen .8s ease-out}
.next:active{transform:translateY(2px);filter:brightness(.94)}

.stage-tiles{display:grid;gap:8px;background:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
.stile{border:1px solid rgb(255 255 255 / .85);border-radius:16px;background:linear-gradient(180deg,#fff,#e9eefb);box-shadow:var(--sh-1),inset 0 1px 0 #fff;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .25s}
.stile::after{left:14px;right:14px;height:4px;border-radius:4px;opacity:.85}
.stile:hover{transform:translateY(-3px);box-shadow:var(--sh-2),inset 0 1px 0 #fff}
.stile:active{transform:translateY(1px) scale(.99)}
.stile[aria-pressed="true"]{background:linear-gradient(160deg,var(--stage),color-mix(in srgb,var(--stage) 62%,#000));box-shadow:0 12px 24px -10px var(--stage),inset 0 1px 0 rgb(255 255 255 / .35);transform:translateY(-2px)}

.kpi{position:relative;overflow:hidden;border-top:0;border-radius:18px}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.kpi.good::before{background:linear-gradient(90deg,#059669,#34d399)}
.kpi.warn::before{background:linear-gradient(90deg,#dc2626,#fb7185)}
.kpi b{background:linear-gradient(120deg,var(--ink),#4338ca);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi.good b{background:linear-gradient(120deg,#065f46,#059669);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi.warn b{background:linear-gradient(120deg,#9f1239,#e11d48);-webkit-background-clip:text;background-clip:text;color:transparent}

.bar-fill{position:relative;overflow:hidden;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.bar-fill.alt{background:linear-gradient(90deg,#8e9cb8,#c3cde0)}
.bar-row.hi .bar-fill{background:linear-gradient(90deg,#0284c7,#38bdf8)}
.btn.primary{border-color:transparent;background:linear-gradient(140deg,var(--brand),var(--brand-2));box-shadow:0 12px 26px -12px rgb(79 70 229 / .95)}
.btn.go{border-color:transparent;background:linear-gradient(140deg,#059669,#10b981);box-shadow:0 12px 26px -12px rgb(5 150 105 / .95)}
.btn,.mini,.qa,.chip,.late-pill,.stile,.next{position:relative;overflow:hidden}
.btn:active,.mini:active,.qa:active{transform:translateY(1px) scale(.99)}
.pill-status{background:linear-gradient(140deg,var(--stage),color-mix(in srgb,var(--stage) 58%,#000));box-shadow:0 8px 18px -10px var(--stage)}
.badge.sent{box-shadow:inset 0 0 0 1px rgb(5 150 105 / .25)}
.tile input:checked+span,.pill input:checked+span{background:linear-gradient(160deg,#eef0ff,#e3e8ff);box-shadow:inset 0 0 0 1px var(--brand),0 8px 18px -12px rgb(79 70 229 / .8)}
.empty{background:rgb(255 255 255 / .45)}
.lane{border-radius:18px}
.hrow,.att-row{border-radius:14px;transition:transform .18s,box-shadow .18s}
.hrow:hover,.att-row:hover{transform:translateY(-2px);box-shadow:var(--sh-3)}
.ripple{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:rgb(255 255 255 / .55);pointer-events:none;transform:scale(0);animation:ripple .55s ease-out forwards}
.btn .ripple,.stile .ripple,.mini .ripple,.qa .ripple{background:rgb(79 70 229 / .28)}
.btn.primary .ripple,.btn.go .ripple,.next .ripple{background:rgb(255 255 255 / .5)}
@media(min-width:1024px){.lane{background:rgb(255 255 255 / .38);border:1px solid rgb(255 255 255 / .6);box-shadow:inset 0 1px 0 rgb(255 255 255 / .8)}}

@media(prefers-reduced-motion:no-preference){
  .tilt{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px)!important;transition:transform .12s ease-out}
  .lanes.intro .card{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
  .lanes.intro .card:nth-child(2){animation-delay:.05s}
  .lanes.intro .card:nth-child(3){animation-delay:.1s}
  .lanes.intro .card:nth-child(4){animation-delay:.15s}
  .lanes.intro .card:nth-child(n+5){animation-delay:.2s}
  .kpis .kpi{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  .kpis .kpi:nth-child(2){animation-delay:.06s}
  .kpis .kpi:nth-child(3){animation-delay:.12s}
  .kpis .kpi:nth-child(4){animation-delay:.18s}
  .report .dgrid>.panel{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:.12s}
  .bar-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgb(255 255 255 / .5),transparent);transform:translateX(-100%);animation:shimmer 2.6s ease-in-out infinite}
  .tl li.current .mk{animation:pulse 2.4s ease-in-out infinite}
  .card.flash{animation:flashGlow 1.8s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
  @keyframes sheen{from{left:-60%}to{left:120%}}
  @keyframes shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
  @keyframes ripple{to{transform:scale(22);opacity:0}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 5px color-mix(in srgb,var(--stage) 24%,transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--stage) 8%,transparent)}}
  @keyframes flashGlow{0%,35%{box-shadow:0 0 0 4px #a5b4fc,var(--sh-3)}100%{box-shadow:var(--sh-2)}}
}
@media(max-width:639px){.card::before{width:6px}.card-body{padding-left:18px}}
</style>

<script>

const FLOW = ['RECEIVED', 'WASH_STARTED', 'WASHING', 'WASH_COMPLETE', 'READY_FOR_DELIVERY', 'DELIVERED'];
const ACTIVE = FLOW.slice(0, 5);
const STAGE = {
  RECEIVED: { label: 'Received', short: 'Received', color: '#475569', action: 'Start Wash' },
  WASH_STARTED: { label: 'Wash Started', short: 'Started', color: '#d97706', action: 'Now Washing' },
  WASHING: { label: 'Washing', short: 'Washing', color: '#0284c7', action: 'Wash Done' },
  WASH_COMPLETE: { label: 'Wash Complete', short: 'Done', color: '#7c3aed', action: 'Mark Ready' },
  READY_FOR_DELIVERY: { label: 'Ready for Delivery', short: 'Ready', color: '#059669', action: 'Delivered' },
  DELIVERED: { label: 'Delivered', short: 'Delivered', color: '#1e1b4b' },
};
const NOTIFY = {
  RECEIVED: { event: 'Vehicle received', text: (j) => `Hi ${j.customer}, your vehicle ${fmtReg(j.reg)} has been received at ${BUSINESS}. We will keep you updated on its progress.` },
  WASH_STARTED: { event: 'Wash started', text: (j) => `Hi ${j.customer}, washing has started for your vehicle ${fmtReg(j.reg)} at ${BUSINESS}.` },
  READY_FOR_DELIVERY: { event: 'Ready for pickup', text: (j) => `Hi ${j.customer}, your vehicle ${fmtReg(j.reg)} is ready for pickup at ${BUSINESS}. Thank you.` },
};
const ETA = [
  { v: 'svc', l: 'Service time' },
  { v: '30', l: '+30 min' },
  { v: '60', l: '+1 hr' },
  { v: '120', l: '+2 hr' },
  { v: 'none', l: 'Not set' },

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const normReg = (v) => String(v || '').toUpperCase().replace(/[\s.\-\/]/g, '');
function fmtReg(n) {
  let m = n.match(/^(\d{2})(BH)(\d{4})([A-Z]{1,2})$/);
  if (m) return m.slice(1).join(' ');
  m = n.match(/^([A-Z]{2})(\d{1,2})([A-Z]{0,3})(\d{1,4})$/);
  return m ? m.slice(1).filter(Boolean).join(' ') : n;
}
function normPhone(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.length === 12 && d.startsWith('91')) d = d.slice(2);
  else if (d.length === 11 && d.startsWith('0')) d = d.slice(1);
  return /^[6-9]\d{9}$/.test(d) ? d : null;
}
const fmtPhone = (d) => `+91 ${d.slice(0, 5)} ${d.slice(5)}`;
function fmtTime(t) {
  const d = new Date(t);
  const h = d.getHours();
  return `${h % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
}
function fmtDur(ms) {
  const m = Math.max(0, Math.floor(ms / MIN));
  if (m < 1) return 'just now';
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
const fmtMins = (m) => (m < 60 ? `${m} min` : `${m / 60} hr`);
const roundUp5 = (t) => Math.ceil(t / (5 * MIN)) * 5 * MIN;
const service = (id) => SERVICES.find((s) => s.id === id);
const byId = (id) => jobs.find((j) => j.id === id);
const vehicleName = (j) => [j.make, j.model].filter(Boolean).join(' ');
const isLate = (j) => !!j.expectedAt && !['READY_FOR_DELIVERY', 'DELIVERED'].includes(j.status) && Date.now() > j.expectedAt;
function fmtShort(ms) {
  const m = Math.max(0, Math.floor(ms / MIN));
  if (m < 1) return 'just now';
  return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
}
// One calm action colour everywhere; green only for the final hand-over.
const actionColor = (j) => (j.status === 'READY_FOR_DELIVERY' ? '#059669' : '#4f46e5');
function sinceInfo(j) {
  const now = Date.now();
  if (j.status === 'DELIVERED') return { text: `Delivered ${fmtTime(j.deliveredAt)}`, cls: 'ready' };
  if (isLate(j)) return { text: `⚠ Late ${fmtShort(Math.max(MIN, now - j.expectedAt))}`, cls: 'late' };
  if (j.status === 'READY_FOR_DELIVERY') return { text: `Waiting ${fmtShort(now - j.stageAt)}`, cls: 'ready' };
  return { text: `⏱ ${fmtShort(now - j.stageAt)}`, cls: '' };
}

  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function makeNotif(job, status, at, st) {
  const attachment = status === 'READY_FOR_DELIVERY' && (job.photos || []).some((p) => p.kind === 'AFTER');
  return { key: status, event: NOTIFY[status].event, to: fmtPhone(job.phone), text: NOTIFY[status].text(job), status: st, queuedAt: at, sentAt: st === 'Sent' ? at + 3000 : null, attachment };
}
const PAY = [
  { v: 'CASH', l: '💵 Cash', name: 'Cash' },
  { v: 'UPI', l: '📱 UPI', name: 'UPI' },
  { v: 'CARD', l: '💳 Card', name: 'Card' },
  { v: 'UNPAID', l: 'Pay later', name: 'Unpaid' },
];
const payName = (v) => PAY.find((p) => p.v === v)?.name || v;
const inr = (n) => '₹' + Math.round(n).toLocaleString('en-IN');

function seed(o) {
  const t0 = Date.now();
  const crew = o.staff || ['Salim', 'Ravi'];
  const history = o.ago.map((a, i) => ({ kind: i === 0 ? 'CREATE' : 'ADVANCE', from: i === 0 ? null : FLOW[i - 1], to: FLOW[i], at: t0 - a * MIN, by: crew[i % crew.length] }));
  const last = history[history.length - 1];
  const job = {
    id: 'j' + ++seq, number: seq, reg: o.reg, make: o.make, model: o.model, customer: o.customer, phone: o.phone,
    service: o.service, status: last.to, receivedAt: history[0].at, stageAt: last.at,
    expectedAt: o.due == null ? null : roundUp5(t0 + o.due * MIN), notes: o.notes || '', notify: true,
    history, notifs: [], photos: [], deliveredAt: last.to === 'DELIVERED' ? last.at : null, createdBy: history[0].by,
    payment: last.to === 'DELIVERED' ? { method: o.pay || 'CASH', amount: service(o.service).price, at: last.at, by: last.by } : null,
  };
  const photoTimes = { BEFORE: history[0].at + MIN, AFTER: (history[3] || last).at + MIN };
  for (const kind of ['BEFORE', 'AFTER']) {
    for (let i = 0; i < ((o.photos || {})[kind] || 0); i++) {
      job.photos.push({ id: 'p' + ++photoSeq, kind, url: demoPhoto(fmtReg(o.reg), kind, seq + i), at: photoTimes[kind] + i * 20000, by: history[0].by, demo: true });
    }
  }
  history.forEach((h) => { if (NOTIFY[h.to]) job.notifs.push(makeNotif(job, h.to, h.at, 'Sent')); });
  jobs.push(job);
}

function findVehicle(reg) {
  const j = jobs.filter((x) => x.reg === reg).sort((a, b) => b.receivedAt - a.receivedAt)[0];
  if (j) return { ...j, active: j.status !== 'DELIVERED' ? j : null };
  return pastVehicles.find((v) => v.reg === reg) || null;
}
function findCustomer(phone) {
  return jobs.filter((x) => x.phone === phone).sort((a, b) => b.receivedAt - a.receivedAt)[0] || pastVehicles.find((v) => v.phone === phone) || null;
}
const visits = (reg) => (pastVisits[reg] || 0) + jobs.filter((j) => j.reg === reg).length;

// ---------- routing ----------
const app = $('#app');
const ui = { filter: 'ALL', q: '', highlight: null, flashId: null, searchOpen: false };
let undoState = null;
let toastTimer;

function currentView() {
  const m = (location.hash || '#/jobs').match(/^#\/(\w+)(?:\/(.+))?/);
  const view = m && ['jobs', 'new', 'history', 'job', 'reports'].includes(m[1]) ? m[1] : 'jobs';
  return { view, id: m && m[2] };
}
function render() {
  const { view, id } = currentView();
  document.body.dataset.view = view;
  app.classList.remove('view-in');
  void app.offsetWidth; // restart the page-enter animation
  app.classList.add('view-in');
  closeSheet();
  closeLightbox();
  document.querySelectorAll('[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === view || (view === 'job' && a.dataset.nav === 'jobs')));
  if (view === 'new') renderNew();
  else if (view === 'history') renderHistory();
  else if (view === 'job') renderDetail(id);
  else if (view === 'reports') renderReports();
  else renderBoard();
  if (!ui.highlight) window.scrollTo(0, 0);
}
function refresh() {
  const { view, id } = currentView();
  if (view === 'jobs' && $('#lanes')) updateBoard();
  else if (view === 'job') { const y = window.scrollY; renderDetail(id); window.scrollTo(0, y); }

}
window.addEventListener('hashchange', render);

// ---------- board ----------
// Per-viewer UI preferences (e.g. a dismissed tip). Storage may be unavailable, so never rely on it.
function readPref(key) { try { return localStorage.getItem('cw-proto:' + key); } catch { return null; } }
function writePref(key, value) { try { localStorage.setItem('cw-proto:' + key, value); } catch { /* ignore */ } }
function dismissTip() {
  writePref('tip-drag', '1');
  const el = document.getElementById('tip');
  if (el) el.innerHTML = '';
}
document.addEventListener('click', (e) => { if (e.target.closest('[data-tip-close]')) dismissTip(); });

function matches(j, q) {
  if (!q.trim()) return true;
  const n = normReg(q), d = q.replace(/\D/g, '');
  return (n && j.reg.includes(n)) || j.customer.toLowerCase().includes(q.trim().toLowerCase()) || (d.length >= 3 && j.phone.includes(d));
}
function renderBoard() {
  const searchOpen = ui.searchOpen || !!ui.q.trim();
  const searchIcon = '<svg class="ico-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  app.innerHTML = `<section>
    <div class="board-sticky${searchOpen ? ' search-open' : ''}" id="boardTop">
      <div class="board-head">
        <div class="bh-title"><h1>Live Jobs</h1><span class="count-pill" id="activeCount"></span></div>

          <button class="late-pill" id="lateBtn" data-filter="LATE" hidden></button>

        </div>
        <label class="search-wrap">${searchIcon}
          <input class="search" id="q" type="search" placeholder="Vehicle number (e.g. 1234) or name" aria-label="Search by vehicle number or customer name" autocomplete="off" value="${esc(ui.q)}"></label>
      </div>

    </div>

    <div class="lanes" id="lanes"></div></section>`;
  $('#q').addEventListener('input', (e) => { ui.q = e.target.value; updateBoard(); });

    const open = !$('#boardTop').classList.contains('search-open');

  }
}
function updateBoard() {
  const act = jobs.filter((j) => j.status !== 'DELIVERED');
  const vis = act.filter((j) => matches(j, ui.q));
  const lateCount = vis.filter(isLate).length;
  if (ui.filter === 'LATE' && !lateCount) ui.filter = 'ALL';
  const shown = ui.filter === 'LATE' ? vis.filter(isLate) : vis;
  const count = $('#activeCount');
  count.textContent = act.length;
  count.setAttribute('aria-label', `${act.length} vehicles in progress`);
  const noMatch = $('#noMatch');
  noMatch.hidden = shown.length > 0;
  noMatch.textContent = ui.q.trim() ? 'No vehicles match your search' : 'No vehicles in progress';
  $('#chips').innerHTML = ACTIVE.map((s) => {
    const n = vis.filter((j) => j.status === s).length;

  }).join('');
  const lateBtn = $('#lateBtn');
  lateBtn.hidden = !lateCount;
  lateBtn.textContent = `⚠ ${lateCount} late`;
  lateBtn.setAttribute('aria-pressed', ui.filter === 'LATE');
  const lanes = $('#lanes');
  lanes.classList.toggle('all', !ACTIVE.includes(ui.filter));
  lanes.innerHTML = ACTIVE.map((s) => {
    const list = shown.filter((j) => j.status === s).sort((a, b) => a.stageAt - b.stageAt);
    const cls = ['lane', list.length ? '' : 'is-empty', ACTIVE.includes(ui.filter) && ui.filter !== s ? 'filtered-out' : ''].join(' ');
    return `<section class="${cls}" data-drop="${s}" style="--stage:${STAGE[s].color}">
      <h2 class="lane-title"><span class="dot"></span>${STAGE[s].label}<span class="n">${list.length}</span>${ACTIVE.includes(ui.filter) ? '<button class="show-all" data-filter="ALL">Show all</button>' : ''}</h2>
      <div class="lane-list">${list.map(card).join('') || '<div class="empty">No vehicles</div>'}</div></section>`;
  }).join('');
  if (ui.highlight) {
    const el = document.querySelector(`[data-card="${ui.highlight}"]`);

  }
}
function card(j) {
  const s = STAGE[j.status];
  const next = FLOW[FLOW.indexOf(j.status) + 1];
  const since = sinceInfo(j);
  const reg = esc(fmtReg(j.reg));

  return `<article class="card${isLate(j) ? ' is-late' : ''}" data-card="${j.id}" style="--stage:${s.color};--stage-next:${actionColor(j)}">
    <button class="card-body" data-open="${j.id}" aria-label="Open ${reg} details">
      <span class="c-row1"><span class="reg">${reg}</span><span class="since ${since.cls}" title="Time in current stage">${since.text}</span></span>
      <span class="c-row2">${esc(vehicleName(j) || 'Vehicle')} · ${esc(j.customer)}</span>
      <span class="c-row3"><span>${esc(service(j.service).name)}</span>${j.expectedAt ? `<span>Due <b>${fmtTime(j.expectedAt)}</b></span>` : ''}${j.photos.length ? `<span>📷 ${j.photos.length}</span>` : ''}${j.notes ? '<span title="Has notes">📝</span>' : ''}<span class="c-in">In <b>${fmtTime(j.receivedAt)}</b></span><span class="c-no">#${j.number}</span></span>
    </button>
    <button class="next${final ? ' is-final' : ''}" data-next="${j.id}"><span class="next-label">${s.action}</span><span class="next-arrow" aria-hidden="true">${final ? '✓' : '→'}</span></button>
  </article>`;
}

// ---------- actions ----------
function notify(j, status) {
  if (!j.notify || !NOTIFY[status] || j.notifs.some((n) => n.key === status)) return false; // once per job+event
  const n = makeNotif(j, status, Date.now(), 'Queued');
  j.notifs.push(n);
  setTimeout(() => { n.status = 'Sent'; n.sentAt = Date.now(); if (currentView().view === 'job') refresh(); }, 1500);
  return true;
}
function advance(id) {
  const j = byId(id);
  if (!j || j.status === 'DELIVERED') return;
  if (j.status === 'READY_FOR_DELIVERY') return openDeliver(j);
  doAdvance(id);
}
function doAdvance(id, payMethod) {
  const j = byId(id);
  const from = j.status, to = FLOW[FLOW.indexOf(from) + 1];
  if (!to) return;
  const prevStageAt = j.stageAt, at = Date.now();
  j.status = to; j.stageAt = at;
  j.history.push({ kind: 'ADVANCE', from, to, at, by: STAFF });
  let payNote = '';
  if (to === 'DELIVERED') {
    const amount = service(j.service).price;
    j.deliveredAt = at;
    j.payment = { method: payMethod, amount, at, by: STAFF };
    payNote = payMethod === 'UNPAID' ? `⚠ ${inr(amount)} marked unpaid` : `✓ ${inr(amount)} received by ${payName(payMethod)}`;
  }
  const sent = notify(j, to);
  undoState = { id, from, to, prevStageAt };
  ui.flashId = id;
  toast(`${fmtReg(j.reg)} → ${STAGE[to].label}`, sent ? `✓ WhatsApp update sent to ${j.customer}` : payNote, true);
  refresh();
}
function runUndo() {
  const u = undoState;
  undoState = null;
  if (!u) return;
  const j = byId(u.id);
  if (!j || j.status !== u.to) return;
  j.status = u.from; j.stageAt = u.prevStageAt;
  j.history.push({ kind: u.wasBack ? 'ADVANCE' : 'REVERT', from: u.to, to: u.from, at: Date.now(), by: STAFF });
  if (u.to === 'DELIVERED') { j.deliveredAt = null; j.payment = null; }
  ui.flashId = j.id;
  toast(`Undone · ${fmtReg(j.reg)} is back in ${STAGE[u.from].label}`, '', false);
  refresh();
}
function toast(msg, sub, withUndo) {
  const el = $('#toast');
  el.innerHTML = `<div>${esc(msg)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>${withUndo ? '<button data-undo>Undo</button>' : ''}`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; undoState = null; }, withUndo ? 6000 : 3000);
}
function openDeliver(j) {
  const prevPay = document.querySelector('#sheet input[name="pay"]:checked')?.value; // keep choice across re-renders
  $('#sheet').innerHTML = `<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Hand over this vehicle?</h2>
    <p class="reg">${esc(fmtReg(j.reg))}</p>
    <p>${esc(vehicleName(j))} · ${esc(j.customer)} · ${fmtPhone(j.phone)}</p>
    <div class="sheet-photos">${photoGroup(j, 'BEFORE', false)}${photoGroup(j, 'AFTER', true)}</div>
    <fieldset class="pay-box" id="payBox"><legend>Payment · <b>${inr(service(j.service).price)}</b> <span class="opt">${esc(service(j.service).name)}</span></legend>
      <div class="pay-grid">${PAY.map((p) => `<label class="pill"><input type="radio" name="pay" value="${p.v}"${p.v === prevPay ? ' checked' : ''}><span>${p.l}</span></label>`).join('')}</div>
      <small class="err" id="payErr"></small></fieldset>
    <div class="btn-row"><button class="btn" data-close>Cancel</button><button class="btn go" data-deliver="${j.id}">✓ Yes, Delivered</button></div>
  </div></div>`;
  $('#overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeSheet(); });

}
function closeSheet() { $('#sheet').innerHTML = ''; }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-next],[data-open],[data-filter],[data-close],[data-deliver],[data-undo]');
  if (!t) return;
  if (t.dataset.next) advance(t.dataset.next);
  else if (t.dataset.open) { if (Date.now() > drag.suppressClickUntil) location.hash = `#/job/${t.dataset.open}`; }
  else if (t.dataset.filter) {
    const f = t.dataset.filter; // tapping the active stage again shows everything
    ui.filter = f !== 'ALL' && ui.filter === f ? 'ALL' : f;
    updateBoard();
    window.scrollTo(0, 0);
  }
  else if (t.dataset.deliver) {
    const pay = document.querySelector('#sheet input[name="pay"]:checked')?.value;
    if (!pay) {
      $('#payErr').textContent = 'Choose how the customer paid';
      $('#payBox').scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
    const id = t.dataset.deliver;
    closeSheet();
    doAdvance(id, pay);
  }
  else if ('close' in t.dataset) closeSheet();
  else if ('undo' in t.dataset) { $('#toast').hidden = true; runUndo(); }
});
document.addEventListener('keydown', (e) => {
  if (lb) {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') stepLightbox(-1);
    else if (e.key === 'ArrowRight') stepLightbox(1);
    return;
  }
  if (e.key === 'Escape') closeSheet();
});

// ---------- payments ----------
function payBadge(j) {
  if (!j.payment) return '';
  return j.payment.method === 'UNPAID'
    ? `<span class="badge unpaid">Unpaid ${inr(j.payment.amount)}</span>`
    : `<span class="badge sent">Paid ${inr(j.payment.amount)} · ${payName(j.payment.method)}</span>`;
}
function paymentCell(j) {
  if (!j.payment) return `<span class="muted">Collect ${inr(service(j.service).price)} at delivery</span>`;
  if (j.payment.method !== 'UNPAID') return `${payBadge(j)} <small class="muted">${fmtTime(j.payment.at)} · ${esc(j.payment.by)}</small>`;
  return `${payBadge(j)}<div class="pay-later">Collect now:
    ${PAY.filter((p) => p.v !== 'UNPAID').map((p) => `<button class="mini" data-pay="${j.id}|${p.v}">${p.l}</button>`).join('')}</div>`;

function markPaid(id, method) {
  const j = byId(id);
  if (!j?.payment || j.payment.method !== 'UNPAID') return;
  j.payment = { ...j.payment, method, at: Date.now(), by: STAFF, paidLater: true };
  toast(`${fmtReg(j.reg)} · ${inr(j.payment.amount)} received`, `✓ Paid by ${payName(method)}`, false);
  refresh();
}
document.addEventListener('click', (e) => {

// ---------- daily summary ----------
// Prototype: "today" = every job in memory. The real app would use the business's
// time zone and business day, and send the summary from the server at closing time.
const OWNER_CONTACTS = [
  { id: 'owner', name: 'Suresh (Owner)', phone: '9847012000' },
  { id: 'manager', name: 'Deepa (Manager)', phone: '9847012001' },
];
const report = {
  closeTime: readPref('close-time') || '21:00',
  recipients: new Set((readPref('recipients') || 'owner').split(',').filter(Boolean)),
  sent: [],
  closedAt: null,
};

function hourLabel(h) { return `${h % 12 || 12} ${h >= 12 ? 'PM' : 'AM'}`; }
function timeLabel(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
}
const fmtDay = (t) => new Date(t).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

function dailySummary() {
  const now = Date.now();
  const all = jobs.slice();
  const delivered = all.filter((j) => j.status === 'DELIVERED');
  const inBay = all.filter((j) => j.status !== 'DELIVERED').sort((a, b) => a.receivedAt - b.receivedAt);
  const paidJobs = delivered.filter((j) => j.payment && j.payment.method !== 'UNPAID');
  const unpaidJobs = delivered.filter((j) => j.payment?.method === 'UNPAID');
  const byMethod = Object.fromEntries(PAY.filter((p) => p.v !== 'UNPAID').map((p) => [p.v, 0]));
  paidJobs.forEach((j) => { byMethod[j.payment.method] += j.payment.amount; });
  const collected = paidJobs.reduce((s, j) => s + j.payment.amount, 0);
  const unpaid = unpaidJobs.reduce((s, j) => s + j.payment.amount, 0);
  const pipeline = inBay.reduce((s, j) => s + service(j.service).price, 0);

  const readyAt = (j) => [...j.history].reverse().find((h) => h.to === 'READY_FOR_DELIVERY' && h.kind !== 'REVERT')?.at;
  const lateDone = delivered.filter((j) => j.expectedAt && readyAt(j) > j.expectedAt);
  const late = lateDone.length + inBay.filter(isLate).length;
  const avgTurn = delivered.length ? delivered.reduce((s, j) => s + (j.deliveredAt - j.receivedAt), 0) / delivered.length : 0;

  const services = SERVICES.map((s) => {
    const list = all.filter((j) => j.service === s.id);
    return { ...s, count: list.length, value: list.length * s.price };
  }).filter((s) => s.count).sort((a, b) => b.count - a.count || b.value - a.value);

  // Bucket by clock hour in time order (a business day can run past midnight).
  const HOUR = 60 * MIN;
  const hourStart = (t) => { const d = new Date(t); d.setMinutes(0, 0, 0); return d.getTime(); };
  const counts = new Map();
  all.forEach((j) => { const k = hourStart(j.receivedAt); counts.set(k, (counts.get(k) || 0) + 1); });
  const keys = [...counts.keys()].sort((a, b) => a - b);
  const hourRows = keys.length ? Array.from({ length: Math.round((keys.at(-1) - keys[0]) / HOUR) + 1 }, (_, i) => {
    const t = hourStart(keys[0] + i * HOUR + 30 * MIN);
    return { h: new Date(t).getHours(), n: counts.get(t) || 0 };
  }) : [];
  const busiest = hourRows.reduce((b, r) => (r.n > (b?.n || 0) ? r : b), null);

  const staff = {};
  all.forEach((j) => j.history.forEach((h) => {
    if (h.kind === 'REVERT') return;
    const s = (staff[h.by] ||= { name: h.by, cars: new Set(), updates: 0, deliveries: 0 });
    s.cars.add(j.id);
    s.updates++;
    if (h.to === 'DELIVERED') s.deliveries++;
  }));
  const staffRows = Object.values(staff).map((s) => ({ ...s, cars: s.cars.size })).sort((a, b) => b.cars - a.cars || b.updates - a.updates);

  const isReturning = (j) => (pastVisits[j.reg] || 0) > 0 || pastVehicles.some((v) => v.reg === j.reg || v.phone === j.phone)
    || all.some((o) => o !== j && o.receivedAt < j.receivedAt && (o.reg === j.reg || o.phone === j.phone));
  const returning = all.filter(isReturning).length;

  const uncollected = inBay.filter((j) => j.status === 'READY_FOR_DELIVERY' && now - j.stageAt > 15 * MIN);
  return { now, all, delivered, inBay, collected, unpaid, unpaidJobs, byMethod, pipeline, late, avgTurn, services, hourRows, busiest, staffRows, returning, newCustomers: all.length - returning, uncollected };
}

function summaryText(r) {
  const methods = PAY.filter((p) => p.v !== 'UNPAID' && r.byMethod[p.v]).map((p) => `${p.name} ${inr(r.byMethod[p.v])}`).join(' · ');
  const top = r.services[0];
  const lines = [
    `*${BUSINESS} — Daily summary*`,
    fmtDay(r.now),
    '',
    `🚗 Cars: ${r.all.length} received · ${r.delivered.length} delivered · ${r.inBay.length} in bay`,
    `💰 Collected: ${inr(r.collected)}${methods ? ` (${methods})` : ''}`,
  ];
  if (r.unpaid) lines.push(`⏳ Unpaid: ${inr(r.unpaid)} (${r.unpaidJobs.length} car${r.unpaidJobs.length === 1 ? '' : 's'})`);
  if (top) lines.push(`⭐ Top service: ${top.name} (${top.count})`);
  if (r.delivered.length) lines.push(`⏱ Avg turnaround: ${fmtDur(r.avgTurn)} · Late: ${r.late}`);
  if (r.busiest) lines.push(`📈 Busiest hour: ${hourLabel(r.busiest.h)}–${hourLabel(r.busiest.h + 1)} (${r.busiest.n} cars)`);
  if (r.staffRows.length) lines.push(`👷 Staff: ${r.staffRows.map((s) => `${s.name} ${s.cars}`).join(' · ')}`);
  lines.push(`🙋 New customers: ${r.newCustomers} · Returning: ${r.returning}`);
  const alerts = [
    ...r.uncollected.map((j) => `⚠ Not collected: ${fmtReg(j.reg)} (ready ${fmtDur(r.now - j.stageAt)})`),
    ...r.unpaidJobs.map((j) => `⚠ Unpaid: ${fmtReg(j.reg)} · ${j.customer} · ${inr(j.payment.amount)}`),
  ];
  if (alerts.length) lines.push('', ...alerts.slice(0, 4), ...(alerts.length > 4 ? [`…and ${alerts.length - 4} more`] : []));
  if (r.inBay.length) lines.push('', `➡ ${r.inBay.length} car${r.inBay.length === 1 ? '' : 's'} carried over to tomorrow (${inr(r.pipeline)} pending)`);
  return lines.join('\n');
}

function barList(rows, max, cls = '') {
  return `<div class="bars">${rows.map((r) => `<div class="bar-row${r.hi ? ' hi' : ''}"><span class="bar-l">${r.label}</span>
    <span class="bar-track"><span class="bar-fill ${cls}" style="width:${max ? Math.max(3, (r.value / max) * 100) : 0}%"></span></span>
    <span class="bar-v">${r.text}</span></div>`).join('')}</div>`;

      <div class="panel"><h2>Services</h2>

function csvCell(v) { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function exportCsv() {
  const head = ['Job', 'Vehicle number', 'Vehicle', 'Customer', 'Service', 'Price', 'Status', 'Received', 'Delivered', 'Turnaround (min)', 'Payment', 'Handled by'];
  const rows = jobs.slice().sort((a, b) => a.number - b.number).map((j) => [

// ---------- photos (before / after) ----------
// Prototype: photos live only in this browser tab. Each image is resized (max 1600px) and re-encoded
// as JPEG in the browser, which also strips EXIF metadata such as GPS location.
// Before photos are damage evidence: the uploader may delete a photo only within 10 minutes.
const MAX_PHOTOS = 10;
const MAX_UPLOAD_BYTES = 20 * 1024 * 1024;
const PHOTO_DELETE_WINDOW = 10 * MIN;
let draftPhotos = [];
let lb = null;

const photosOf = (j, kind) => j.photos.filter((p) => p.kind === kind);
const kindLabel = (kind) => (kind === 'BEFORE' ? 'Before' : 'After');
const canDeletePhoto = (p) => !p.demo && p.by === STAFF && Date.now() - p.at < PHOTO_DELETE_WINDOW;

function photoGroup(j, kind, allowAdd = true) {
  const list = photosOf(j, kind);
  const label = kindLabel(kind);
  const thumbs = list.map((p, i) => `<button class="thumb" data-photo-view="${j.id}|${kind}|${i}" aria-label="${label} photo ${i + 1}">
      <img src="${p.url}" alt="" loading="lazy"><span class="thumb-time">${fmtTime(p.at)}</span></button>`).join('');
  const add = allowAdd && list.length < MAX_PHOTOS ? `<button class="add-photo" data-photo-add="${j.id}|${kind}"><span aria-hidden="true">📷</span>Add ${label.toLowerCase()}</button>` : '';
  const empty = !list.length && !add ? '<span class="muted">None</span>' : '';
  return `<div><h3>${label} <span class="n">${list.length}</span></h3><div class="photo-grid">${thumbs}${add}${empty}</div></div>`;
}
function renderDraftPhotos() {
  const el = document.getElementById('draftPhotos');
  if (!el) return;
  el.innerHTML = draftPhotos.map((p, i) => `<div class="thumb"><img src="${p.url}" alt="Before photo ${i + 1}">
      <button type="button" class="thumb-x" data-draft-remove="${i}" aria-label="Remove photo ${i + 1}">×</button></div>`).join('')
    + (draftPhotos.length < MAX_PHOTOS ? '<button type="button" class="add-photo" data-photo-add="draft|BEFORE"><span aria-hidden="true">📷</span>Add photo</button>' : '');
}
function pickFiles() {
  // No `capture` attribute: phones then offer both "Camera" and "Photos/Files".
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.addEventListener('change', () => resolve([...input.files]), { once: true });
    input.addEventListener('cancel', () => resolve([]), { once: true });
    input.click();
  });
}
async function compressImage(file, maxSide = 1600, quality = 0.82) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close?.();
  const blob = await new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error('encode failed'))), 'image/jpeg', quality));
  return URL.createObjectURL(blob);
}
async function addPhotoFiles(files, kind, list, onDone, btn) {
  if (!files.length) return;
  const room = MAX_PHOTOS - list.filter((p) => p.kind === kind).length;
  if (room <= 0) return toast(`Up to ${MAX_PHOTOS} ${kind.toLowerCase()} photos per job`, '', false);
  btn?.setAttribute('aria-busy', 'true');
  let added = 0, rejected = 0;
  for (const file of files.slice(0, room)) {
    if (!file.type.startsWith('image/') || file.size > MAX_UPLOAD_BYTES) { rejected++; continue; }
    try {
      list.push({ id: 'p' + ++photoSeq, kind, url: await compressImage(file), at: Date.now(), by: STAFF });
      added++;
    } catch { rejected++; }
  }
  btn?.removeAttribute('aria-busy');
  const over = Math.max(0, files.length - room);
  const problems = [rejected && `${rejected} not a supported image (max 20 MB)`, over && `${over} over the ${MAX_PHOTOS}-photo limit`].filter(Boolean).join(' · ');
  toast(added ? `📷 ${added} ${kind.toLowerCase()} photo${added === 1 ? '' : 's'} added` : 'No photos added', problems, false);
  onDone();
}

function openLightbox(jobId, kind, index) { lb = { jobId, kind, index }; renderLightbox(); }
function closeLightbox() { lb = null; $('#lightbox').innerHTML = ''; }
function stepLightbox(delta) { if (lb) { lb.index += delta; renderLightbox(); } }
function renderLightbox() {
  const j = byId(lb.jobId);
  const list = j ? photosOf(j, lb.kind) : [];
  if (!list.length) return closeLightbox();
  lb.index = Math.max(0, Math.min(lb.index, list.length - 1));
  const p = list[lb.index];
  const minsLeft = Math.ceil((PHOTO_DELETE_WINDOW - (Date.now() - p.at)) / MIN);
  $('#lightbox').innerHTML = `<div class="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-top"><div><b>${fmtReg(j.reg)} · ${kindLabel(lb.kind)} ${lb.index + 1} of ${list.length}</b><small>${fmtTime(p.at)} · ${esc(p.by)}</small></div>
      <button class="lb-btn" data-lb-close aria-label="Close">✕</button></div>
    <div class="lb-stage">
      <button class="lb-nav prev" data-lb-prev aria-label="Previous photo"${lb.index === 0 ? ' disabled' : ''}>‹</button>
      <img src="${p.url}" alt="${kindLabel(lb.kind)} photo ${lb.index + 1}">
      <button class="lb-nav next" data-lb-next aria-label="Next photo"${lb.index === list.length - 1 ? ' disabled' : ''}>›</button>
    </div>
    <div class="lb-bottom">${canDeletePhoto(p)
      ? `<button class="btn danger" data-lb-delete>Delete photo <small>(${minsLeft} min left)</small></button>`
      : '<span class="lock">🔒 Locked as a job record · only the owner can remove it</span>'}</div>
  </div>`;
  const stage = $('.lb-stage');
  let startX = null;
  stage.addEventListener('pointerdown', (e) => { startX = e.clientX; });
  stage.addEventListener('pointerup', (e) => {
    if (startX == null) return;
    const dx = e.clientX - startX;
    startX = null;
    if (Math.abs(dx) > 50) stepLightbox(dx < 0 ? 1 : -1);
  });
  $('[data-lb-close]').focus();
}
function deleteCurrentPhoto() {
  const j = byId(lb.jobId);
  const p = photosOf(j, lb.kind)[lb.index];
  if (!p || !canDeletePhoto(p) || !confirm('Delete this photo?')) return;
  j.photos.splice(j.photos.indexOf(p), 1);
  URL.revokeObjectURL(p.url);
  renderLightbox();
  refresh();
  toast('Photo deleted', '', false);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-photo-add],[data-photo-view],[data-draft-remove],[data-lb-prev],[data-lb-next],[data-lb-close],[data-lb-delete]');
  if (!t) return;
  if (t.dataset.photoAdd) {
    if (t.getAttribute('aria-busy') === 'true') return;
    const [jobId, kind] = t.dataset.photoAdd.split('|');
    pickFiles().then((files) => {
      if (jobId === 'draft') return addPhotoFiles(files, kind, draftPhotos, renderDraftPhotos, t);
      const j = byId(jobId);
      addPhotoFiles(files, kind, j.photos, () => { if ($('#overlay')) openDeliver(j); refresh(); }, t);
    });
  } else if (t.dataset.photoView) {
    const [jobId, kind, i] = t.dataset.photoView.split('|');
    openLightbox(jobId, kind, Number(i));
  } else if (t.dataset.draftRemove) {
    const [removed] = draftPhotos.splice(Number(t.dataset.draftRemove), 1);
    if (removed) URL.revokeObjectURL(removed.url);
    renderDraftPhotos();
  } else if ('lbPrev' in t.dataset) stepLightbox(-1);
  else if ('lbNext' in t.dataset) stepLightbox(1);
  else if ('lbClose' in t.dataset) closeLightbox();
  else if ('lbDelete' in t.dataset) deleteCurrentPhoto();
});

// ---------- drag and drop (mouse, touch and pen via Pointer Events) ----------
// Mouse: drag after moving 6px. Touch: press and hold 350ms, so normal scrolling still works.
// Targets: board columns (desktop) and a bottom tray of stages (all screens).
// Rules match the job state machine: one stage forward, or one stage back (a recorded correction).
const drag = { pending: null, active: null, suppressClickUntil: 0 };

function dropRule(j, target) {
  const i = FLOW.indexOf(j.status), t = FLOW.indexOf(target);
  return t === i ? 'current' : t === i + 1 ? 'next' : t === i - 1 ? 'back' : 'no';
}
const dropClass = (j, target) => ({ current: 'drop-current', next: 'drop-ok', back: 'drop-ok', no: 'drop-no' })[dropRule(j, target)];

document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || drag.active || currentView().view !== 'jobs') return;
  const cardEl = e.target.closest('.card');
  if (!cardEl || e.target.closest('.next')) return;
  const p = { id: cardEl.dataset.card, el: cardEl, x: e.clientX, y: e.clientY, pointerId: e.pointerId, type: e.pointerType, timer: null };
  if (p.type !== 'mouse') p.timer = setTimeout(() => startDrag(p, p.x, p.y), 350);
  drag.pending = p;
});
document.addEventListener('pointermove', (e) => {
  if (drag.active) { if (e.pointerId === drag.active.pointerId) moveDrag(e.clientX, e.clientY); return; }
  const p = drag.pending;
  if (!p || e.pointerId !== p.pointerId) return;
  const dist = Math.hypot(e.clientX - p.x, e.clientY - p.y);
  if (p.type === 'mouse') { if (dist > 6) startDrag(p, e.clientX, e.clientY); }
  else if (dist > 10) cancelPending(); // finger moved before the hold finished: it's a scroll
});
document.addEventListener('pointerup', (e) => {
  if (drag.active && e.pointerId === drag.active.pointerId) endDrag(e.clientX, e.clientY);
  else cancelPending();
});
document.addEventListener('pointercancel', () => { cancelPending(); cleanupDrag(); });
document.addEventListener('touchmove', (e) => { if (drag.active) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', (e) => { if (drag.pending || drag.active) e.preventDefault(); });

function cancelPending() {
  if (drag.pending) clearTimeout(drag.pending.timer);
  drag.pending = null;
}
function startDrag(p, x, y) {
  cancelPending();
  const j = byId(p.id);
  if (!j || !document.body.contains(p.el)) return;
  const r = p.el.getBoundingClientRect();
  let ghost, dx, dy;
  if (p.type === 'mouse') {
    ghost = p.el.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.width = `${r.width}px`;
    dx = p.x - r.left; dy = p.y - r.top;
  } else {
    // On touch a full card would hide the drop targets under the finger: float a small chip above it.
    ghost = document.createElement('div');
    ghost.className = 'ghost ghost-chip';
    ghost.style.setProperty('--stage', STAGE[j.status].color);
    ghost.textContent = fmtReg(j.reg);
    document.body.appendChild(ghost);
    dx = ghost.offsetWidth / 2; dy = ghost.offsetHeight + 56;
  }
  document.body.appendChild(ghost);
  drag.active = { ...p, job: j, ghost, dx, dy, over: null };
  p.el.classList.add('drag-src');
  document.body.classList.add('dragging');
  $('#toast').hidden = true;
  const hint = { current: 'Current', next: 'Move here', back: 'Move back', no: 'Not allowed' };
  $('#tray').innerHTML = `<div class="tray-title">Drop ${esc(fmtReg(j.reg))} on a stage</div><div class="tray-grid">${FLOW.map((s) =>
    `<div class="drop ${dropClass(j, s)}" data-drop="${s}" style="--stage:${STAGE[s].color}"><span class="dot"></span><b>${STAGE[s].short}</b><small>${hint[dropRule(j, s)]}</small></div>`).join('')}</div>`;
  $('#tray').hidden = false;
  document.querySelectorAll('.lane[data-drop]').forEach((l) => l.classList.add(dropClass(j, l.dataset.drop)));
  if (p.type !== 'mouse') navigator.vibrate?.(15);
  moveDrag(x, y);
}
function moveDrag(x, y) {
  const d = drag.active;
  d.ghost.style.transform = `translate(${x - d.dx}px, ${y - d.dy}px) rotate(2deg)`;
  const target = document.elementFromPoint(x, y)?.closest('[data-drop]') || null;
  if (d.over !== target) {
    d.over?.classList.remove('over');
    target?.classList.add('over');
    d.over = target;
  }
}
function endDrag(x, y) {
  moveDrag(x, y);
  const { job, over } = drag.active;
  const target = over?.dataset.drop;
  cleanupDrag();
  drag.suppressClickUntil = Date.now() + 500;
  if (target) { moveJobTo(job, target); dismissTip(); }
}
function cleanupDrag() {
  const d = drag.active;
  if (!d) return;
  d.ghost.remove();
  d.el.classList.remove('drag-src');
  document.body.classList.remove('dragging');
  $('#tray').hidden = true;
  $('#tray').innerHTML = '';
  document.querySelectorAll('.lane[data-drop]').forEach((l) => l.classList.remove('drop-ok', 'drop-no', 'drop-current', 'over'));
  drag.active = null;
}
function moveJobTo(j, target) {
  const rule = dropRule(j, target);
  if (rule === 'next') advance(j.id);
  else if (rule === 'back') moveBack(j.id);
  else if (rule === 'no') toast(`Move one stage at a time — ${fmtReg(j.reg)} can't go from ${STAGE[j.status].label} to ${STAGE[target].label}`, '', false);
}
function moveBack(id) {
  const j = byId(id);
  const i = FLOW.indexOf(j.status);
  if (i <= 0 || j.status === 'DELIVERED') return;
  const from = j.status, to = FLOW[i - 1], prevStageAt = j.stageAt;
  const entered = [...j.history].reverse().find((h) => h.to === to && h.kind !== 'REVERT');
  j.status = to;
  j.stageAt = entered ? entered.at : Date.now();
  j.history.push({ kind: 'REVERT', from, to, at: Date.now(), by: STAFF });
  undoState = { id, from, to, prevStageAt, wasBack: true };
  ui.flashId = id;
  toast(`${fmtReg(j.reg)} moved back to ${STAGE[to].label}`, '', true);
  refresh();
}

setInterval(() => { if (!drag.active && !$('#overlay') && currentView().view === 'jobs' && $('#lanes') && document.activeElement?.id !== 'q') updateBoard(); }, 30000);

// ---------- premium motion: tilt, ripple, counting numbers ----------
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = () => matchMedia('(pointer: fine)').matches;

document.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.btn,.next,.stile,.chip,.qa,.mini,.late-pill');
  if (!el || reducedMotion()) return;
  const r = el.getBoundingClientRect();
  const dot = document.createElement('span');
  dot.className = 'ripple';
  dot.style.left = `${e.clientX - r.left}px`;
  dot.style.top = `${e.clientY - r.top}px`;
  el.appendChild(dot);
  setTimeout(() => dot.remove(), 600);
});

let tilted = null;
document.addEventListener('pointermove', (e) => {
  if (!finePointer() || reducedMotion() || drag.active) return;
  const el = e.target.closest('.kpi,.stile');
  if (el !== tilted) {
    tilted?.classList.remove('tilt');
    tilted?.style.removeProperty('--rx');
    tilted?.style.removeProperty('--ry');
    tilted = el;
  }
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.classList.add('tilt');
  el.style.setProperty('--ry', `${((e.clientX - r.left) / r.width - 0.5) * 9}deg`);
  el.style.setProperty('--rx', `${(0.5 - (e.clientY - r.top) / r.height) * 9}deg`);
});

// Headline figures count up when the summary opens.
function animateCounters(root) {
  if (reducedMotion()) return;
  root.querySelectorAll('.kpi b').forEach((el) => {
    const target = el.textContent.trim();
    if (!/^₹?[\d,]+$/.test(target)) return; // skip values like "1h 24m"
    const end = Number(target.replace(/[^\d]/g, ''));
    if (!end) return;
    const money = target.startsWith('₹');
    const t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / 700);
      const v = Math.round(end * (1 - (1 - k) ** 3));
      el.textContent = (money ? '₹' : '') + v.toLocaleString('en-IN');
      if (k < 1) requestAnimationFrame(step);
      else el.textContent = target;
    };
    el.textContent = money ? '₹0' : '0';
    requestAnimationFrame(step);
  });
}

render();

</script>
</body>
