<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d9df3">
<meta name="color-scheme" content="dark light">
<title>KleenBay — Car Wash Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div id="auth"></div>

<div class="shell">
  <aside class="rail" aria-label="Main">
    <a class="mark" href="#/board" aria-label="KleenBay home">
      <span class="mark-glyph" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 3.5c-4.8 6-9 10.9-9 16a9 9 0 0 0 18 0c0-5.1-4.2-10-9-16Z"/><path d="M10.6 21.2h10.8M11.6 21.2l1.3-3.2c.3-.7.9-1.1 1.6-1.1h3c.7 0 1.3.4 1.6 1.1l1.3 3.2v2.4H11.6z"/><circle cx="13.6" cy="23.9" r=".4"/><circle cx="18.4" cy="23.9" r=".4"/></svg></span>
      <span class="mark-text"><b>Kleen<span class="wm-bay">Bay</span></b><small>Sparkle Car Wash</small></span>
    </a>
    <nav class="rail-nav" id="railNav" aria-label="Main"></nav>
    <div class="rail-foot">
      <button class="icon-btn theme-btn" aria-label="Switch theme"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M20 13.5A8.5 8.5 0 0 1 10.5 4a8.5 8.5 0 1 0 9.5 9.5Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg></button>
      <div class="who" id="who"></div>
      <button class="icon-btn" data-signout aria-label="Sign out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg></button>
    </div>
  </aside>

  <div class="frame">
    <header class="topbar">
      <div class="topbar-lead">
        <span class="mark-glyph only-mobile" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 3.5c-4.8 6-9 10.9-9 16a9 9 0 0 0 18 0c0-5.1-4.2-10-9-16Z"/><path d="M10.6 21.2h10.8M11.6 21.2l1.3-3.2c.3-.7.9-1.1 1.6-1.1h3c.7 0 1.3.4 1.6 1.1l1.3 3.2v2.4H11.6z"/><circle cx="13.6" cy="23.9" r=".4"/><circle cx="18.4" cy="23.9" r=".4"/></svg></span>
        <div class="topbar-title"><h1 id="viewTitle">Board</h1><p id="viewMeta">Live jobs</p></div>
      </div>
      <div class="topbar-actions">
        <span class="proto-chip" title="Clickable prototype with sample data">Prototype</span>
        <button class="icon-btn" id="searchBtn" aria-label="Find a vehicle"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.6"/><path d="m20 20-3.6-3.6"/></svg></button>
        <button class="icon-btn only-mobile theme-btn" aria-label="Switch theme"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M20 13.5A8.5 8.5 0 0 1 10.5 4a8.5 8.5 0 1 0 9.5 9.5Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg></button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="sheet"></div>
<div id="tray" class="tray" hidden></div>
<div id="lightbox"></div>
<script src="app.js"></script>
</body>
</html>
